<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#09090b"><title>الكذّاب | طاولة الظلال</title>
<style>
:root{--bg:#09090b;--panel:rgba(25,24,27,.78);--line:rgba(220,187,112,.2);--gold:#c9a765;--red:#a51f2b;--muted:#aaa4a0;--green:#80bd91}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#442023 0,#171114 35%,var(--bg) 75%);color:#f4eee8;font:16px Tahoma,Arial,sans-serif;text-align:center;padding:12px 14px 32px}button,input,select{font:inherit;color:inherit;border-radius:14px;border:1px solid var(--line);padding:14px 18px;margin:5px;background:#211d20}button{min-height:52px;background:linear-gradient(135deg,#a52530,#6e111a);box-shadow:0 8px 24px #0007;cursor:pointer;transition:transform .18s,filter .18s}button:active{transform:scale(.97);filter:brightness(1.2)}button.gold{background:linear-gradient(135deg,#d6b878,#896b35);color:#17120a}button.red{background:linear-gradient(135deg,#c52b39,#710d18)}button.ghost{background:#242125}.top{max-width:760px;margin:auto}.brand{letter-spacing:2px;color:var(--gold);font-size:13px}.title{font-size:28px;margin:5px 0 14px}.card{max-width:700px;margin:12px auto;padding:17px;border-radius:20px;background:linear-gradient(145deg,#ffffff0c,#ffffff04),var(--panel);border:1px solid var(--line);box-shadow:0 14px 40px #0005,inset 0 1px #ffffff0b;backdrop-filter:blur(12px)}.big{font-size:32px;color:#e6c783;margin:8px}.players{display:flex;gap:8px;overflow-x:auto;padding:4px 1px 10px;scrollbar-width:thin}.player{flex:0 0 auto;min-width:100px;padding:10px;border-radius:14px;background:#ffffff08;border:1px solid #ffffff12}.player.active{border-color:#d4ad64;box-shadow:0 0 18px #bd8e3f42}.avatar{font-size:24px}.small,.muted{font-size:13px;color:var(--muted)}.row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.log{text-align:right;max-height:140px;overflow:auto;color:#d1c8bf;font-size:14px}.log div{border-bottom:1px solid #ffffff0b;padding:7px}.gun{max-width:430px;margin:8px auto;filter:drop-shadow(0 4px 15px #a5162040);transform-origin:50% 50%}.gun.spin{animation:spin .85s ease-in-out}.gun.shot{animation:recoil .35s ease-out}@keyframes spin{to{transform:rotate(360deg)}}@keyframes recoil{30%{transform:translateX(-14px) rotate(-3deg)}to{transform:none}}.chamber{display:inline-block;width:22px;height:22px;border:1px solid #847c70;border-radius:50%;margin:4px;background:radial-gradient(#555,#171719)}.chamber.used{background:#09090b;border-color:#4a4341}.tip{color:#cfbd8c;font-size:13px;margin-top:8px}.qr{width:176px;height:176px;background:white;border-radius:12px;padding:8px;margin:10px}.fl{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 48%,#ffb65caa,#c10d20aa 20%,transparent 62%);opacity:0;pointer-events:none;transition:opacity .12s}.fl.on{opacity:1}.count{font-size:48px;color:#edc976;animation:pulse .45s infinite alternate}@keyframes pulse{to{transform:scale(1.12);text-shadow:0 0 25px #d33}}.event{color:#d8bb80}
</style></head><body><div class="top"><div class="brand">✦ طاولة الظلال ✦</div><h1 class="title">🔫 الكذّاب</h1><div id="app"></div></div><div id="fl" class="fl"></div><script>
const q=new URLSearchParams(location.search),H=q.get('host')==='1',me=H?'H':(localStorage.id||(localStorage.id=Math.random().toString(36).slice(2,9)));let name=localStorage.n||'',S={phase:'lobby',max:4,shots:1,players:[],log:[]},ws,AC,joined=false,muted=false,timer=null;const B={};
const $=i=>document.getElementById(i),P=i=>S.players.find(p=>p.id==i),N=i=>(P(i)||{}).n||'لاعب';
const GUN=`<svg class="gun" id="gun" viewBox="0 0 400 220" width="100%"><defs><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#99928b"/><stop offset=".5" stop-color="#4b4848"/><stop offset="1" stop-color="#171719"/></linearGradient><linearGradient id="w" x2="1" y2="1"><stop stop-color="#78543b"/><stop offset="1" stop-color="#241612"/></linearGradient></defs><path d="M62 98 116 108 102 200Q98 212 84 210L40 198Q28 194 32 182Z" fill="url(#w)" stroke="#080808" stroke-width="4"/><path d="m50 122 48 14m-52 19 45 14m-45 9 40 13" stroke="#b99c75" opacity=".28"/><rect x="150" y="56" width="236" height="26" rx="5" fill="url(#s)" stroke="#111" stroke-width="3"/><rect x="150" y="48" width="236" height="8" rx="2" fill="url(#s)"/><path d="M70 60h105v52h-45q-18 2-24 14l-6 24H66Z" fill="url(#s)" stroke="#111" stroke-width="3"/><rect x="112" y="56" width="68" height="58" rx="10" fill="url(#s)" stroke="#111" stroke-width="3"/><path d="M128 60v50m18-50v50m18-50v50M122 124q24 40 54-6" fill="none" stroke="#111" stroke-width="5"/><path d="M141 67q-9 8 0 14-8 9 1 14l5 9 5-9q9-5 1-14 9-6 0-14zm1 12 9 9m0-9-9 9" fill="#170c0e" stroke="#9d3435" stroke-width="1.5"/><path d="M155 60h230" stroke="#eee" stroke-opacity=".3" stroke-width="2"/><path d="m57 53-8-12 16-7 19 22" fill="#494444" stroke="#111" stroke-width="3"/></svg>`;
function snd(t){if(muted)return;try{AC=AC||new AudioContext();let n=AC.currentTime,bg=t==='bang',d=bg?1:.09,b=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*Math.pow(1-i/x.length,bg?3:6);let s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=b;f.type=bg?'lowpass':'highpass';f.frequency.value=bg?1800:2500;g.gain.value=bg?.8:.3;s.connect(f);f.connect(g);g.connect(AC.destination);s.start(n);if(bg){let o=AC.createOscillator(),og=AC.createGain();o.frequency.setValueAtTime(120,n);o.frequency.exponentialRampToValueAtTime(30,n+.5);og.gain.setValueAtTime(.6,n);og.gain.exponentialRampToValueAtTime(.001,n+.55);o.connect(og);og.connect(AC.destination);o.start(n);o.stop(n+.55)}}catch(e){}}
const send=m=>ws&&ws.readyState===1&&ws.send(JSON.stringify(m)),go=m=>H?act(m):send(m);
function conn(){try{ws=new WebSocket('ws://'+location.host);ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.s)apply(m);else if(H&&m.a)act(m)};ws.onclose=()=>setTimeout(conn,1200);ws.onerror=()=>{try{ws.close()}catch(e){}}}catch(e){setTimeout(conn,1500)}}
function apply(m){let prev=S.turn;S=m.s;if(m.ev){snd(m.ev);if(m.ev==='bang'){$('fl').classList.add('on');setTimeout(()=>$('fl').classList.remove('on'),220);navigator.vibrate&&navigator.vibrate([100,50,500]);setTimeout(()=>{$('gun')?.classList.add('shot')},0)}if(m.ev==='turn'&&S.turn===me){snd('click');navigator.vibrate&&navigator.vibrate([100,70,100])}}if(S.phase==='countdown'){let c=3;clearInterval(timer);timer=setInterval(()=>{if($('count'))$('count').textContent=--c;if(c<=0){clearInterval(timer);if(H)act({a:'reveal',by:'H'})}},850)}draw()}
function push(ev){let m={s:S,ev:ev||null};send(m);apply(m)}function nextAlive(id){let a=S.players,i=a.findIndex(p=>p.id==id);for(let k=1;k<=a.length;k++){let p=a[(i+k)%a.length];if(p.alive)return p.id}}
function round(st){S.phase='play';S.card=['ملك','ملكة','آس'][Math.random()*3|0];S.turn=st;S.last=null;S.players.forEach(p=>p.said=false)}function log(t){S.log=S.log||[];S.log.unshift(t);S.log=S.log.slice(0,30)}
function act(m){if(m.a==='join'){if(!P(m.id)&&S.phase==='lobby'&&S.players.length<S.max)S.players.push({id:m.id,n:m.n,alive:true,k:0});push()}
else if(m.a==='spectate'){if(!P(m.id))S.players.push({id:m.id,n:m.n,alive:false,k:0,spectator:true});push()}
else if(m.a==='start'&&S.phase==='lobby'&&S.players.filter(p=>!p.spectator).length>1){S.players.forEach(p=>{p.k=0;p.alive=!p.spectator;B[p.id]=[...Array(6).keys()].sort(()=>Math.random()-.5).slice(0,S.shots)});round(S.players.find(p=>p.alive).id);log('بدأت الجولة');push()}
else if(m.a==='play'&&S.phase==='play'&&S.turn===m.id){S.last=m.id;S.turn=nextAlive(m.id);log(`${N(m.id)} وضع أوراقه`);push('turn')}
else if(m.a==='liar'&&S.phase==='play'&&S.turn===m.id&&S.last){S.phase='judge';S.caller=m.id;S.target=S.last;log(`${N(m.id)} قال كذّاب على ${N(S.target)}`);push()}
else if(m.a==='lose'&&S.phase==='judge'&&(m.by===S.caller||m.by==='H')){S.phase='countdown';S.victim=m.v;push()}
else if(m.a==='reveal'&&S.phase==='countdown'){S.phase='roulette';push()}
else if(m.a==='pull'&&S.phase==='roulette'&&m.id===S.victim){let p=P(m.id),d=(B[p.id]||[]).includes(p.k);p.k++;p.alive=!d;S.phase='result';S.res=d?'dead':'safe';log(d?`${p.n} أصابته الطلقة`:`${p.n} نجا من الطلقة`);push(d?'bang':'click')}
else if(m.a==='next'&&S.phase==='result'&&(m.by===S.victim||m.by==='H')){let al=S.players.filter(p=>p.alive);if(al.length<2){S.phase='over';S.winner=al[0]&&al[0].n}else round(P(S.victim).alive?S.victim:nextAlive(S.victim));push('turn')}
else if(m.a==='kick'&&m.by==='H'&&S.phase==='lobby'){S.players=S.players.filter(p=>p.id!==m.id);push()}}
function join(spectate=false){name=$('nm').value.trim()||'لاعب';localStorage.n=name;joined=true;snd('click');if(H){S.max=+$('mx').value;S.shots=+$('shots').value;act({a:'join',id:me,n:name})}else go({a:spectate?'spectate':'join',id:me,n:name});draw()}
function draw(){let h='';const p=P(me),ph=S.phase,icons=['🎩','🃏','🦊','🐦‍⬛','🎭','♠️','🎲','🌙'],L=S.players.map((x,i)=>`<div class="player ${x.id===S.turn&&ph==='play'?'active':''}"><div class="avatar">${x.spectator?'👁️':icons[i%icons.length]}</div><b>${x.n}</b><div class="small">${x.spectator?'متفرج':`${x.alive?'🟢':'💀'} • سُحب ${x.k||0}/6`}</div>${H&&ph==='lobby'&&x.id!=='H'?`<button class="ghost" onclick="go({a:'kick',id:'${x.id}',by:me})">طرد</button>`:''}</div>`).join('');
if(!joined){h+=`<div class="card"><p>ادخل إلى طاولة الروليت</p><input id="nm" placeholder="اسمك" value="${name}">`+(H?`<div class="row"><label>اللاعبون <select id="mx">${[2,3,4,5,6,7,8].map(i=>`<option ${i===S.max?'selected':''}>${i}</option>`).join('')}</select></label><label>طلقات المسدس <select id="shots">${[1,2,3].map(i=>`<option ${i===S.shots?'selected':''}>${i}</option>`).join('')}</select></label></div>`:'')+`<button class="gold" onclick="join()">${H?'فتح الغرفة':'انضمام'}</button>${!H?'<button class="ghost" onclick="join(true)">دخول كمتفرج</button>':''}</div>`}
else if(!p)h+='<div class="card">الغرفة ممتلئة أو بدأت المباراة. أعد الاتصال أو ادخل كمتفرج.</div>';
else{if(ph==='lobby'){h+=`<div class="card">${H?`<p>امسح الرمز للانضمام إلى الغرفة</p><img class="qr" alt="رمز QR للغرفة" src="${window.AndroidBridge?.getQrDataUrl()||''}"><div class="small" dir="ltr">http://${q.get('ip')}:8080</div><button class="ghost" onclick="showQr()">📷 QR</button>`:''}<div class="players">${L}</div><div class="muted">${S.players.length}/${S.max} لاعب</div>${H?'<button class="gold" onclick="go({a:\'start\'})">ابدأ اللعب</button>':'<div class="muted">بانتظار المضيف…</div>'}</div>`}
else{h+=`<div class="card"><div class="players">${L}</div><div class="row">${H?'<button class="ghost" onclick="showQr()">📷 QR</button>':''}${H?`<button class="ghost" onclick="muted=!muted;draw()">${muted?'🔇 الصوت مكتوم':'🔊 الصوت يعمل'}</button>`:''}</div></div>`;
if(ph==='play'){h+=`<div class="card">الورقة المطلوبة<div class="big">${S.card}</div><div class="tip">🃏 الجوكر يُحسب صحيحاً</div>${p.spectator?'<div>أنت تتابع المباراة كمتفرج</div>':!p.alive?'<div>💀 أنت خارج اللعبة — يمكنك متابعة الأحداث</div>':S.turn===me?'<div class="event">دورك الآن</div>'+(S.last?'<button class="red" onclick="go({a:\'liar\',id:me})">كذّاب!</button>':'')+'<button onclick="go({a:\'play\',id:me})">وضعتُ أوراقي</button>':`<div>الدور على ${N(S.turn)}</div>`}</div>`}
if(ph==='judge')h+=`<div class="card">${N(S.caller)} قال «كذّاب!» على ${N(S.target)}<p>اكشفوا الأوراق على الطاولة</p>${p.id===S.caller?`<button onclick="go({a:'lose',v:'${S.target}',by:me})">${N(S.target)} كان كاذباً</button><button class="ghost" onclick="go({a:'lose',v:'${S.caller}',by:me})">أنا أخطأت</button>`:''}</div>`;
if(ph==='countdown')h+=`<div class="card"><div>${N(S.victim)} سيلعب الروليت…</div><div class="count" id="count">3</div></div>`;
if(ph==='roulette'||ph==='result'){let v=P(S.victim);h+=`<div class="card"><div>🎯 ${v.n} يلعب الروليت</div>${GUN}<div>${Array.from({length:6},(_,i)=>`<span class="chamber ${i<v.k?'used':''}"></span>`).join('')}</div><div class="tip">${S.shots} ${S.shots===1?'طلقة': 'طلقات'} في الأسطوانة • الخانات المتبقية: ${Math.max(1,6-v.k)}</div>${ph==='roulette'&&me===S.victim?'<button class="red" onclick="document.getElementById(\'gun\').classList.add(\'spin\');setTimeout(()=>go({a:\'pull\',id:me}),850)">اسحب الزناد</button>':''}${ph==='result'?`<div class="big">${S.res==='dead'?'💥 مات '+v.n:'✔ نجا '+v.n}</div>${me===S.victim||H?'<button onclick="go({a:\'next\',by:me})">متابعة</button>':''}`:''}</div>`}
if(ph==='over')h+=`<div class="card big">🏆 الفائز: ${S.winner||'لا أحد'}</div>`;
}h+=`<div class="card"><b>سجل الأحداث</b><div class="log">${(S.log||[]).map(x=>`<div>${x}</div>`).join('')||'<div class="muted">لا توجد أحداث بعد</div>'}</div></div>`}
}
function showQr(){let url=`http://${q.get('ip')}:8080`;let qr=window.AndroidBridge?.getQrDataUrl()||'';let box=document.createElement('div');box.className='fl on';box.style.cssText='z-index:9;display:grid;place-items:center;background:#000d';box.innerHTML=`<div class="card" style="background:#171518"><button class="ghost" onclick="this.parentElement.parentElement.remove()">إغلاق ✕</button><h3>📷 امسح للانضمام</h3>${qr?`<img class="qr" src="${qr}">`:''}<div dir="ltr">${url}</div></div>`;document.body.appendChild(box)}
draw();conn();
</script></body></html>
