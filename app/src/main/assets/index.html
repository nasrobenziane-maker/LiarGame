</style></head><body><div class="top"><div class="brand">✦ طاولة الظلال ✦</div><h1 class="title">🔫 الكذّاب</h1><div id="app"></div></div><div id="fl" class="fl"></div><div id="blackout" class="blackout"></div><div id="turnGlow" class="turnGlow"></div><div id="vig" class="vig"></div><script>
const q=new URLSearchParams(location.search),H=q.get('host')==='1',me=H?'H':(localStorage.id||(localStorage.id=Math.random().toString(36).slice(2,9)));let name=localStorage.n||'',S={phase:'lobby',max:4,shots:1,countdownSeconds:3,players:[],log:[]},ws,AC,joined=false,muted=false,timer=null,fireTimer=null,fireTicker=null,fireDeadline=0,firing=false,wakeLock=null,wakeStatus="",tiltArmed=false,tiltReady=false,tiltMessage="";const B={};let undoState=null; if(H){try{const saved=JSON.parse(localStorage.hostGame||'null');if(saved&&saved.s){S=saved.s;Object.assign(B,saved.b||{});undoState=saved.u||null}}catch(e){}}let observedTurnKey=S.phase==='play'?`${S.rn}:${S.turn}`:'';
const RULES=['اللعبة من 2 إلى 8 لاعبين، لكل لاعب هاتفه، والأوراق الحقيقية على الطاولة.','في كل جولة تظهر الورقة المطلوبة: ملك أو ملكة أو آس. الجوكر يُحسب صحيحًا دائمًا.','بالدور، يضع اللاعب أوراقًا مقلوبة على الطاولة ويدّعي أنها الورقة المطلوبة، ثم يضغط "وضعتُ أوراقي".','اللاعب التالي إما يضع أوراقه، أو يضغط "كذّاب!" على من قبله.','تُكشف أوراق المتَّهَم. إن كان كاذبًا خسر، وإن كان صادقًا خسر من اتّهمه. صاحب الاتهام يختار الخاسر، فإن لم يفعل اختاره المضيف.','في الرزمة بطاقتان خاصتان: «تغيير» و«عاصفة». تُنزلان مقلوبتين مع باقي الأوراق، وحدهما أو مع الورقة المطلوبة، ولا يظهر أثرهما إلا عند كشف الأوراق بعد نداء «كذّاب». وتُحسبان صحيحتين دائمًا مثل الجوكر. يُعلِم صاحب الاتهام التطبيقَ بالبطاقة التي ظهرت.','الخاسر يلعب الروليت: عدّ تنازلي ثم يسحب الزناد. في المسدس ست خانات فيها رصاصة أو أكثر يحددها المضيف، ولا يُعاد خلطها بين السحبات، فيزداد الخطر مع كل نجاة.','بعد روليت الخاسر، إن بقي صاحب البطاقة الخاصة (المتَّهَم) حيًّا نُفِّذ أثرها. «تغيير»: يبدّل مسدسه مع أي لاعب حي يختاره، حتى صاحب الاتهام. «عاصفة»: يختار كل لاعب حي لاعبًا حيًّا غيره هدفًا، ثم يطلق كلٌّ بمسدسه على هدفه بالدور، ويبدأ صاحب البطاقة ثم بقية الأحياء. الخاسر الناجي يُستهدف ولا يطلق. من يمت يسلّم مسدسه لقاتله، ويختار القاتل أيَّ مسدسيه يلعب به عند خسارته. وإن ظهرت البطاقتان معًا نُفِّذت «تغيير» ثم «عاصفة».','من تصيبه الطلقة يخرج ويتابع كمتفرج. وتبدأ الجولة التالية بالخاسر إن بقي حيًّا.','آخر لاعب حي هو الفائز.'];
const RV=(t=>{let h=5381;for(const c of t)h=((h*33)^c.charCodeAt(0))>>>0;return h.toString(36)})(RULES.join('|'));
const CK={'ملك':'king','ملكة':'queen','آس':'ace'},cardUrl=k=>`/media/cards/${k}.webp?v=1`;let shownRn=null,flipStart=0,gender=localStorage.g||'',gErr=false,selCh=false,selSt=false,stormTimer=null;
['king','queen','ace','joker','back','change','storm'].forEach(k=>{try{new Image().src=cardUrl(k)}catch(e){}});
let popTurn=false,curRisk=-1;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function ST(id){S.stats=S.stats||{};return S.stats[id]||(S.stats[id]={sv:0,cs:0,bs:0,ok:0,lie:0})}
function surv(id){const s=ST(id);s.sv++;s.cs++;s.bs=Math.max(s.bs,s.cs)}
function statsCard(){const ps=S.players.filter(p=>!p.spectator),st=S.stats||{};if(!ps.length||!Object.keys(st).length)return '';const get=(p,k)=>(st[p.id]||{})[k]||0,cats=[['🍀','الأكثر نجاة','sv'],['🔥','أطول سلسلة نجاة','bs'],['🕵️','أمهر كاشف للكذب','ok'],['🤥','كذّاب بامتياز','lie']];let t='';for(const [ic,tt,k] of cats){const mx=Math.max(0,...ps.map(p=>get(p,k)));if(mx>0)t+=`<div class="statTitle"><span>${ic} ${tt}</span><b>${ps.filter(p=>get(p,k)===mx).map(p=>esc(p.n)).join('، ')}</b><small>${mx}</small></div>`}if(!t)return '';const rows=ps.map(p=>`<div class="statRow"><b>${esc(p.n)}</b><span>🍀 ${get(p,'sv')}</span><span>🔥 ${get(p,'bs')}</span><span>🕵️ ${get(p,'ok')}</span><span>🤥 ${get(p,'lie')}</span></div>`).join('');return `<div class="card"><b>📊 إحصاءات الجلسة</b>${t}<div class="small" style="margin-top:10px">🍀 نجاة • 🔥 أطول سلسلة • 🕵️ كشف صحيح • 🤥 مرات الكذب</div><div class="statRows">${rows}</div></div>`}
function riskPulse(){const v=$('vig');if(!v)return;const r=curRisk,ok=r>=50&&!S.fireStartedAt&&!fireDeadline&&(S.phase==='roulette'||S.phase==='stormFire');if(ok){const k=(r-50)/50;v.style.setProperty('--bp',(1.7-1.1*k).toFixed(2)+'s');v.style.setProperty('--vi',(.25+.75*k).toFixed(2));v.classList.add('on','risk')}else if(v.classList.contains('risk'))v.classList.remove('on','risk')}
function hitFx(){const strong=(S.phase==='result'&&S.victim===me)||(S.phase==='stormShot'&&!!S.cur&&S.cur.t===me);try{navigator.vibrate&&navigator.vibrate(strong?[100,50,500]:[60])}catch(e){}if(S.fx===false)return;const top=document.querySelector('.top'),bo=$('blackout');if(top){top.classList.remove('shake','light');void top.offsetWidth;top.classList.add('shake');if(!strong)top.classList.add('light');setTimeout(()=>top.classList.remove('shake','light'),450)}if(bo){bo.classList.remove('on','light');void bo.offsetWidth;if(!strong)bo.classList.add('light');bo.classList.add('on');setTimeout(()=>bo.classList.remove('on','light'),1300)}}
function brandMark(){return '<img class="brandLogo" src="/media/logo.svg" alt="شعار LIAR">'}
function scoreboard(){const wins=S.wins||{};return '<div class="card"><b>🏆 لوحة النتائج</b><div class="players">'+S.players.filter(p=>!p.spectator).map(p=>'<div class="player"><div class="avatar">🏆</div><b>'+p.n+'</b><div class="small">'+(wins[p.id]||0)+' فوز</div></div>').join('')+'</div></div>'}
function accepted(){try{return localStorage.rv===RV}catch(e){return false}}
function acceptRules(){try{localStorage.rv=RV}catch(e){}snd('click');draw();window.scrollTo(0,0)}
function cardsRow(){const f=(k,t,c)=>`<figure class="${c||''}"><img src="${cardUrl(k)}" alt="${t}"><figcaption>${t}</figcaption></figure>`;return `<div class="cardsRow">${f('king','ملك')}${f('queen','ملكة')}${f('ace','آس')}${f('joker','جوكر: يُحسب صحيحًا','joker')}</div>`}
function specialRow(){const f=(k,t)=>`<figure><img src="${cardUrl(k)}" alt="${t}"><figcaption>${t}</figcaption></figure>`;return `<div class="cardsRow">${f('change','تغيير: تبديل المسدس')}${f('storm','عاصفة: الجميع يطلقون')}</div>`}
function rulesList(){return '<ol class="rulesList">'+RULES.map((t,i)=>`<li>${t}${i===1?cardsRow():i===5?specialRow():''}</li>`).join('')+'</ol>'}
function rulesScreen(){return `<div class="card rules">${brandMark()}<div class="brand">✦ قبل الدخول ✦</div><h2>قواعد لعبة الكذّاب</h2>${rulesList()}${H?'<div class="hostNote">هذه الشاشة نفسها ستظهر لضيوفك عند مسح الرمز</div>':''}<button class="gold acceptBtn" onclick="acceptRules()">قرأت القواعد وأوافق</button></div>`}

if(ph==='countdown')h+=`<div class="card victimCard"><div>${N(S.victim)} ${X(S.victim,'سيلعب','ستلعب')} الروليت…</div><div class="count" id="count">3</div></div>`;
if(ph==='roulette'||ph==='result'){let v=P(S.victim),g=G(v)||{k:0,o:[]},rev=ph==='roulette'||revealedNow(),slot=ph==='result'?Math.max(0,Math.min(5,g.k-1)):Math.min(5,g.k),left=Math.max(1,6-g.k),risk=Math.min(100,Math.round(remB(g)/left*100));if(ph==='roulette')curRisk=risk;h+=`<div class="card victimCard ${ph==='result'&&rev?(S.res==='dead'?'glowDead':'glowSafe'):''}"><div>🎯 ${v.n} ${X(v.id,'يلعب','تلعب')} الروليت</div>${cylinder(g,slot,{res:ph==='result',rev})}${ph==='roulette'?riskBar(remB(g),left,risk):''}${GUN}<div class="tip">${remB(g)} ${remB(g)===1?'طلقة':'طلقات'} متبقية في هذه الأسطوانة • لا تُعاد الخلطة بين السحبات</div>${ph==='roulette'&&me===S.victim&&v.gs.length>1&&!S.fireStartedAt?`<div class="small">${Y('اختر','اختاري')} المسدس:</div><div class="row">${v.gs.map((gid,i)=>`<button class="${gid===v.ag?'gold':'ghost'} smallBtn" onclick="go({a:'setGun',id:me,g:'${gid}'})">🔫 ${i+1} (سُحب ${Math.min(6,S.guns[gid].k)}/6)</button>`).join('')}</div>`:''}${ph==='roulette'&&H&&me!==S.victim?`<button class="red" onclick="go({a:'hostFire',by:'H'})">🎯 تنفيذ الروليت نيابةً عن اللاعب</button>`:''}${ph==='roulette'&&me===S.victim?`<button class="gold" onclick="armTilt()">🧭 جهّز الإطلاق بالإمالة</button><button class="red" onclick="manualFire()">إطلاق بالزر</button>${tiltMessage?`<div class="tip">${tiltMessage}</div>`:''}`:''}${S.fireStartedAt?`<div class="fireTimer">الإطلاق خلال <b id="fireCount">${Math.max(0,Math.ceil((fireDeadline-Date.now())/1000))}</b></div>`:''}${ph==='result'&&!rev?'<div class="tip">الأسطوانة تدور…</div>':''}${ph==='result'&&rev?`<div class="big">${S.res==='dead'?'💥 '+X(v.id,'مات ','ماتت ')+v.n:'✔ '+X(v.id,'نجا ','نجت ')+v.n}</div>${me===S.victim||H?'<button onclick="go({a:\'next\',by:me})">متابعة</button>':''}`:''}</div>`}
if(ph==='fxChange'&&S.fxq){const o=S.fxq.o,can=me===o||H;h+=`<div class="card victimCard"><img class="fxImg" src="${cardUrl('change')}" alt="تغيير"><div class="big">🔄 تبديل المسدس</div>${can?`<p>${me===o?Y('اختر لاعباً حيًّا لتبدّل مسدسك معه','اختاري لاعباً حيًّا لتبدّلي مسدسكِ معه'):'اختر نيابة عن '+N(o)+':'}</p>`+S.players.filter(x=>x.alive&&x.id!==o).map(x=>`<button onclick="go({a:'swap',by:me,t:'${x.id}'})">🔄 ${x.n}</button>`).join(''):`<p>${N(o)} ${X(o,'يختار','تختار')} لاعباً ليبدّل مسدسه معه…</p>`}</div>`}

if((ph==='stormFire'||ph==='stormShot')&&S.cur){const c=S.cur,sh=P(c.s),tg=P(c.t),g=G(sh)||{k:0,o:[]},shot=ph==='stormShot',rev=!shot||revealedNow(),slot=shot?Math.max(0,Math.min(5,g.k-1)):Math.min(5,g.k),left=Math.max(1,6-g.k),risk=Math.min(100,Math.round(remB(g)/left*100));if(!shot)curRisk=risk;h+=`<div class="card victimCard ${shot&&rev?(S.sres==='hit'?'glowDead':'glowSafe'):''}"><div>⛈️ ${sh.n} ${X(c.s,'يصوّب','تصوّب')} على ${tg.n}</div>${cylinder(g,slot,{res:shot,rev})}${!shot?riskBar(remB(g),left,risk):''}${GUN}${!shot&&(me===c.s||H)?'<button class="red" onclick="go({a:\'stormShot\',id:me})">🔫 إطلاق</button>':''}${shot&&!rev?'<div class="tip">الأسطوانة تدور…</div>':''}${shot&&rev?`<div class="big">${S.sres==='hit'?'💥 '+tg.n+' '+X(c.t,'مات','ماتت')+' — '+X(c.t,'وانتقل مسدسه','وانتقل مسدسها')+' إلى '+sh.n:'✔ الطلقة لم تصب '+tg.n}</div>`:''}</div>`}
if(ph==='over')h+=`<div class="card big">🏆 ${X(S.winnerId,'الفائز','الفائزة')}: ${S.winner||'لا أحد'}</div>${scoreboard()}${statsCard()}<div class="card">${H?'<button class="gold" onclick="go({a:\'again\',by:me})">🔁 جولة جديدة بنفس اللاعبين</button>':'<div class="muted">بانتظار المضيف لبدء جولة جديدة…</div>'}</div>`;
}h+=`<div class="card"><b>سجل الأحداث</b><div class="log">${(S.log||[]).slice((S.phase==='result'||S.phase==='stormShot')&&!revealedNow()?1:0).map(x=>`<div>${x}</div>`).join('')||'<div class="muted">لا توجد أحداث بعد</div>'}</div></div>`}

function requestWakeLock(){if(!navigator.wakeLock){wakeStatus='المتصفح لا يتيح منع السكون عبر هذا الرابط المحلي';if(joined)draw();return}navigator.wakeLock.request('screen').then(lock=>{wakeLock=lock;wakeStatus='الشاشة مستيقظة أثناء بقاء اللعبة مفتوحة';lock.addEventListener('release',()=>{wakeLock=null;wakeStatus='قد تنطفئ الشاشة إذا أخفاها النظام';if(joined)draw()});if(joined)draw()}).catch(()=>{wakeStatus='لم يسمح المتصفح بمنع السكون';if(joined)draw()})}
document.addEventListener('visibilitychange',()=>{if(joined&&document.visibilityState==='visible')requestWakeLock()});
function animateTrigger(){let t=$('trigger');if(t){t.classList.remove('pulling');void t.offsetWidth;t.classList.add('pulling');setTimeout(()=>t.classList.remove('pulling'),240)}}
function beginFireCountdown(fromTilt){if(firing||S.fireStartedAt)return;firing=true;if(!fromTilt)tiltArmed=false;tiltMessage='';setTimeout(()=>{if(fromTilt&&(!tiltArmed||tiltReady||!isLandscape())){firing=false;return}go({a:'armPull',id:me});firing=false},240)}
function manualFire(){beginFireCountdown(false)}
function isLandscape(){return !!(window.matchMedia&&window.matchMedia('(orientation: landscape)').matches)}
function armTilt(){if(S.phase!=='roulette'||me!==S.victim||S.fireStartedAt)return;tiltArmed=true;tiltReady=!isLandscape();tiltMessage=tiltReady?Y('أمل الهاتف إلى الأفقي لبدء العد','أمِلي الهاتف إلى الأفقي لبدء العد'):Y('أعد الهاتف إلى العمودي ثم أمله إلى الأفقي','أعيدي الهاتف إلى العمودي ثم أميليه إلى الأفقي');draw()}
function handleTilt(){if(!tiltArmed||S.phase!=='roulette'||me!==S.victim)return;if(!isLandscape()){tiltReady=true;if(S.fireStartedAt&&S.fireBy===me){go({a:'cancelPull',id:me});tiltMessage=Y('أُلغي العد؛ أمل الهاتف إلى الأفقي مجدداً','أُلغي العد؛ أمِلي الهاتف إلى الأفقي مجدداً')}else tiltMessage=Y('أمل الهاتف إلى الأفقي لبدء العد','أمِلي الهاتف إلى الأفقي لبدء العد');draw();return}if(tiltReady&&!S.fireStartedAt){tiltReady=false;tiltMessage=Y('بدأ العد؛ أعد الهاتف إلى العمودي لإلغائه','بدأ العد؛ أعيدي الهاتف إلى العمودي لإلغائه');beginFireCountdown(true)}}
const orientationQuery=window.matchMedia?window.matchMedia('(orientation: landscape)'):null;if(orientationQuery){if(orientationQuery.addEventListener)orientationQuery.addEventListener('change',handleTilt);else orientationQuery.addListener(handleTilt)}window.addEventListener('orientationchange',handleTilt)
function qrData(){return window.AndroidBridge&&window.AndroidBridge.getQrDataUrl?window.AndroidBridge.getQrDataUrl():''}
function showQr(){let url=`http://${q.get('ip')}:8080`;let qr=qrData();let box=document.createElement('div');box.className='fl on';box.style.cssText='z-index:9;display:grid;place-items:center;background:#000d;pointer-events:auto';box.innerHTML=`<div class="card" style="background:#171518"><button class="ghost" onclick="this.parentElement.parentElement.remove()">إغلاق ✕</button><h3>📷 امسح للانضمام</h3>${qr?`<img class="qr" src="${qr}">`:''}<div dir="ltr">${url}</div></div>`;document.body.appendChild(box)}
draw();conn();if(H&&S.phase==='roulette'&&S.fireStartedAt){const remain=Math.max(0,S.fireStartedAt+(S.fireSeconds||3)*1000-Date.now());clearTimeout(fireTimer);fireTimer=setTimeout(()=>act({a:'pull',id:S.victim,forced:true}),remain)}
